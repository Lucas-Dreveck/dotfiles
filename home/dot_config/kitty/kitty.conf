font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

enabled_layouts tall

# The `yank` recorder wraps every shell in `script`. The shell emits OSC 133
# prompt marks (through the wrapper), so kitty knows when we're idle at a prompt.
# -1 = only confirm on close if a real command is actually running (not at prompt).
# If it still warns while idle, fall back to `0` (never confirm).
confirm_os_window_close -1
